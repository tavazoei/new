name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # این Job روی کامپیوتر خودت اجرا می‌شود
    runs-on: self-hosted

    steps:
      # --------------------------------------------------
      # 1. دریافت/بروزرسانی کد
      # --------------------------------------------------
      - name: Update deployment folder
        shell: powershell
        run: |

          # رفتن به پوشه‌ای که Production از آن Deploy می‌شود
          cd C:\Users\Mehrdad\Desktop\new

          # دریافت آخرین اطلاعات از GitHub
          git fetch origin

          # قرار دادن پوشه دقیقاً روی آخرین commit شاخه main
          git reset --hard origin/main

      # --------------------------------------------------
      # 2. نمایش اطلاعات برای Debug
      # --------------------------------------------------
      - name: Show deployment information
        shell: powershell
        run: |

          Write-Host "Machine:"
          hostname

          Write-Host "Current directory:"
          Get-Location

          Write-Host "Git commit:"
          git rev-parse --short HEAD

      # --------------------------------------------------
      # 3. ساخت Docker Image
      # --------------------------------------------------
      - name: Build Docker image
        shell: powershell
        run: |

          cd C:\Users\Mehrdad\Desktop\new

          docker build -t shop-api:1.0 .

      # --------------------------------------------------
      # 4. توقف Container قبلی
      # --------------------------------------------------
      - name: Stop old container
        shell: powershell
        run: |

          docker stop shop

          if ($LASTEXITCODE -ne 0) {
              Write-Host "Container shop is not running."
              exit 0
          }

      # --------------------------------------------------
      # 5. حذف Container قبلی
      # --------------------------------------------------
      - name: Remove old container
        shell: powershell
        run: |

          docker rm shop

          if ($LASTEXITCODE -ne 0) {
              Write-Host "Container shop does not exist."
              exit 0
          }

      # --------------------------------------------------
      # 6. اجرای Container جدید
      # --------------------------------------------------
      - name: Run new container
        shell: powershell
        run: |

          docker run -d `
            --name shop `
            -p 8000:8000 `
            shop-api:1.0

      # --------------------------------------------------
      # 7. بررسی Container
      # --------------------------------------------------
      - name: Verify deployment
        shell: powershell
        run: |

          Start-Sleep -Seconds 5

          docker ps

          Write-Host "Container logs:"
          docker logs shop
