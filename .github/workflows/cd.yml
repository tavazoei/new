name: CD

on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install -r requirements.txt

      - name: Stop old FastAPI
        shell: powershell
        run: |
          $connection = Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue

          if ($connection) {
              Write-Host "Stopping old FastAPI..."
              Stop-Process -Id $connection.OwningProcess -Force
          }
          else {
              Write-Host "FastAPI is not running."
          }

      - name: Start new FastAPI
        shell: powershell
        run: |
          Start-Process python `
            -ArgumentList "-m", "uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"

          Write-Host "FastAPI started."
