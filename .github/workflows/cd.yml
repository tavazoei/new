name: CD

on:
  workflow_run:
    workflows: ["Testi"]
    types:
      - completed

jobs:
  docker-test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      # 1. دریافت کد
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. بررسی Runner
      - name: Check runner
        shell: powershell
        run: |
          Write-Host "===== Runner Information ====="
          Write-Host "Computer:"
          hostname

          Write-Host "User:"
          whoami

      # 3. بررسی Docker
      - name: Check Docker
        shell: powershell
        run: |
          Write-Host "===== Docker Version ====="
          & "C:\Users\Mehrdad\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"  --version

          Write-Host "===== Docker Info ====="
          & "C:\Users\Mehrdad\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"  info

      # 4. ساخت Image آزمایشی
      - name: Build Docker image
        shell: powershell
        run: |
          & "C:\Users\Mehrdad\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"  build -t github-actions-docker-test:1.0 .

      # 5. نمایش Image
      - name: Show Docker image
        shell: powershell
        run: |
          & "C:\Users\Mehrdad\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"  images github-actions-docker-test

      # 6. اجرای Container
      - name: Run Docker container
        shell: powershell
        run: |
          & "C:\Users\Mehrdad\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"  run -d `
            --name github-actions-docker-test `
            github-actions-docker-test:1.0

      # 7. بررسی Container
      - name: Check container
        shell: powershell
        run: |
          & "C:\Users\Mehrdad\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"  ps
          & "C:\Users\Mehrdad\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"  logs github-actions-docker-test

      # 8. تست Container
      - name: Test container
        shell: powershell
        run: |
          & "C:\Users\Mehrdad\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"  exec github-actions-docker-test echo "Docker container works!"

      # 9. حذف Container
      - name: Remove test container
        if: always()
        shell: powershell
        run: |
          & "C:\Users\Mehrdad\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"  rm -f github-actions-docker-test

      # 10. پایان
      - name: Docker test completed
        shell: powershell
        run: |
          Write-Host "================================="
          Write-Host "Docker test completed successfully"
          Write-Host "================================="
